<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TMS Translation Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: fixed left nav + working canvas; board scrolls sideways inside its own container. Palette from the team's agreed swatches. */
:root{
  --bg:#F5F7FA; --surface:#FFFFFF; --surface-2:#EEF1F6; --line:#E8ECF2; --line-2:#D6DCE6;
  --fg:#1A2B4A; --muted:#6B7A90; --faint:#9AA6B8;
  --primary:#1A7AC4; --primary-soft:#E3F0FA; --sky:#29A8E0; --pink:#E8417A; --teal:#00B5A5; --amber:#F5A623; --pos:#3DC47E; --neg:#E8417A;
  --nav:#FFFFFF; --nav-head:#9FCBF2; --nav-head-fg:#FFFFFF;
  --l-todo:#ECEEF2; --l-en:#DCEBFB; --l-cn:#E7DEF1; --l-other:#FFF2D2; --l-review:#FFE6CC; --l-assess:#FCE0EC; --l-correct:#F8D8D8; --l-done:#DDF1E3;
  --l-todo-fg:#55637A; --l-en-fg:#1A6CB0; --l-cn-fg:#7A55A8; --l-other-fg:#A87400; --l-review-fg:#B8650A; --l-assess-fg:#C23C75; --l-correct-fg:#B83A3A; --l-done-fg:#2E8A55;
  --shadow:0 1px 2px rgba(26,43,74,.06),0 2px 8px rgba(26,43,74,.05);
  --font:'IBM Plex Sans Thai',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1524; --surface:#162036; --surface-2:#1C2841; --line:#26344F; --line-2:#33435F;
  --fg:#E4EAF4; --muted:#9AA8BE; --faint:#6E7C93;
  --primary:#4FA6E8; --primary-soft:#1B3350; --sky:#4CB9EA; --pink:#F06694; --teal:#2CC9BA; --amber:#F7B647; --pos:#5BD293; --neg:#F06694;
  --nav:#121B2E; --nav-head:#1E4A74; --nav-head-fg:#E4EAF4;
  --l-todo:#1F2940; --l-en:#183552; --l-cn:#2D2645; --l-other:#3A3020; --l-review:#3B2C1C; --l-assess:#3D2232; --l-correct:#3D2224; --l-done:#1C3529;
  --l-todo-fg:#AEB9CC; --l-en-fg:#8CC4F2; --l-cn-fg:#C3A8E6; --l-other-fg:#F2C866; --l-review-fg:#F5AE66; --l-assess-fg:#F293BC; --l-correct-fg:#F29A9A; --l-done-fg:#7FD7A2;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1524; --surface:#162036; --surface-2:#1C2841; --line:#26344F; --line-2:#33435F;
  --fg:#E4EAF4; --muted:#9AA8BE; --faint:#6E7C93;
  --primary:#4FA6E8; --primary-soft:#1B3350; --sky:#4CB9EA; --pink:#F06694; --teal:#2CC9BA; --amber:#F7B647; --pos:#5BD293; --neg:#F06694;
  --nav:#121B2E; --nav-head:#1E4A74; --nav-head-fg:#E4EAF4;
  --l-todo:#1F2940; --l-en:#183552; --l-cn:#2D2645; --l-other:#3A3020; --l-review:#3B2C1C; --l-assess:#3D2232; --l-correct:#3D2224; --l-done:#1C3529;
  --l-todo-fg:#AEB9CC; --l-en-fg:#8CC4F2; --l-cn-fg:#C3A8E6; --l-other-fg:#F2C866; --l-review-fg:#F5AE66; --l-assess-fg:#F293BC; --l-correct-fg:#F29A9A; --l-done-fg:#7FD7A2;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--font);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
/* ---------- Sidebar ---------- */
.side{background:var(--nav);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;max-height:100%}
.brand{background:var(--nav-head);color:var(--nav-head-fg);padding:18px 18px 16px;border-radius:0 0 14px 0;display:flex;gap:10px;align-items:center}
.brand .globe{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;font-weight:700;font-size:12px}
.brand b{display:block;font-size:15px;letter-spacing:.04em}
.brand small{display:block;font-size:12px;opacity:.9}
.nav{padding:10px 0;overflow:auto;flex:1}
.nav h6{margin:14px 18px 4px;font-size:11px;letter-spacing:.08em;color:var(--faint);font-weight:600}
.nav button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8px 18px;cursor:pointer;color:var(--muted);text-align:left;font-weight:500}
.nav button:hover{background:var(--surface-2);color:var(--fg)}
.nav button.on{background:var(--primary-soft);color:var(--primary);font-weight:600}
.nav button[hidden]{display:none}
.nav .ic{width:18px;text-align:center;font-size:13px}
.nav .badge{margin-left:auto;background:var(--sky);color:#fff;font-size:11px;border-radius:99px;padding:0 8px;font-weight:600}
.nav .badge.pink{background:var(--pink)}
.me{border-top:1px solid var(--line);padding:12px 16px;display:grid;gap:8px}
.me-row{display:flex;gap:10px;align-items:center}
.me-row b{display:block;font-size:13px}
.me-row small{color:var(--muted);font-size:11px}
.me label{font-size:11px;color:var(--faint);letter-spacing:.06em}
.me select{width:100%;padding:6px 8px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface)}
.linkbtn{background:none;border:0;color:var(--muted);font-size:12px;cursor:pointer;padding:0;text-align:left;text-decoration:underline}

/* ---------- Main ---------- */
main{min-width:0;padding-block:18px 40px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.topbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
.topbar h1{font-size:20px;margin:0;text-wrap:balance}
.topbar .sub{color:var(--muted);font-size:13px}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:7px 14px;cursor:pointer;font-weight:500;display:inline-flex;gap:6px;align-items:center}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{filter:brightness(1.08);color:#fff}
.btn.danger{color:var(--neg);border-color:color-mix(in srgb,var(--neg) 40%,transparent)}
.btn.danger:hover{background:var(--neg);color:#fff}
.btn.sm{padding:4px 10px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.demo-note{font-size:12px;color:var(--muted);background:var(--surface);border:1px dashed var(--line-2);border-radius:8px;padding:6px 10px}

.filters{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px 14px;margin-bottom:14px}
.filters label{display:grid;gap:2px;font-size:11px;color:var(--muted);letter-spacing:.03em}
.filters input,.filters select{padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);font-size:13px;min-width:0}

/* ---------- Board ---------- */
.board-scroll{overflow-x:auto;padding-bottom:10px}
.board{display:grid;grid-template-columns:repeat(8,minmax(214px,1fr));gap:10px;min-width:max-content}
.lane{border-radius:12px;background:var(--surface-2);display:flex;flex-direction:column;min-height:420px;border:2px solid transparent;transition:border-color .12s}
.lane.drop-ok{border-color:var(--teal)}
.lane.drop-no{border-color:var(--neg);opacity:.75}
.lane-h{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-radius:10px 10px 0 0;font-weight:600;font-size:13px}
.lane-h small{display:block;font-weight:400;font-size:11px;opacity:.8}
.lane-h .cnt{border-radius:99px;padding:0 9px;font-size:12px;color:#fff}
.lane-body{padding:8px;display:flex;flex-direction:column;gap:8px;flex:1}
.lane-empty{font-size:12px;color:var(--faint);text-align:center;padding:16px 6px}
.lane[data-lane="todo"] .lane-h{background:var(--l-todo);color:var(--l-todo-fg)} .lane[data-lane="todo"] .cnt{background:var(--l-todo-fg)}
.lane[data-lane="en"] .lane-h{background:var(--l-en);color:var(--l-en-fg)} .lane[data-lane="en"] .cnt{background:var(--l-en-fg)}
.lane[data-lane="cn"] .lane-h{background:var(--l-cn);color:var(--l-cn-fg)} .lane[data-lane="cn"] .cnt{background:var(--l-cn-fg)}
.lane[data-lane="other"] .lane-h{background:var(--l-other);color:var(--l-other-fg)} .lane[data-lane="other"] .cnt{background:var(--l-other-fg)}
.lane[data-lane="review"] .lane-h{background:var(--l-review);color:var(--l-review-fg)} .lane[data-lane="review"] .cnt{background:var(--l-review-fg)}
.lane[data-lane="assessment"] .lane-h{background:var(--l-assess);color:var(--l-assess-fg)} .lane[data-lane="assessment"] .cnt{background:var(--l-assess-fg)}
.lane[data-lane="correction"] .lane-h{background:var(--l-correct);color:var(--l-correct-fg)} .lane[data-lane="correction"] .cnt{background:var(--l-correct-fg)}
.lane[data-lane="done"] .lane-h{background:var(--l-done);color:var(--l-done-fg)} .lane[data-lane="done"] .cnt{background:var(--l-done-fg)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 10px;box-shadow:var(--shadow);cursor:pointer;display:grid;gap:5px;text-align:left;width:100%}
.card:hover{border-color:var(--primary)}
.card[draggable="true"]{cursor:grab}
.card.dragging{opacity:.4}
.card .cid{font-size:11px;color:var(--faint)}
.card .ttl{font-weight:600;font-size:13px;line-height:1.35}
.card .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.card .foot{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted)}
.card .late{color:var(--neg);font-weight:600}
.urgent{font-size:10px;font-weight:700;color:var(--neg);letter-spacing:.04em}

.chip{display:inline-block;font-size:11px;font-weight:600;border-radius:5px;padding:1px 7px;line-height:1.5;white-space:nowrap}
.s-tbc{background:color-mix(in srgb,var(--amber) 22%,transparent);color:var(--l-other-fg)}
.s-ready{background:color-mix(in srgb,var(--pos) 22%,transparent);color:var(--l-done-fg)}
.s-ongoing{background:var(--sky);color:#fff}
.s-review{background:var(--primary);color:#fff}
.s-edit{background:color-mix(in srgb,var(--neg) 20%,transparent);color:var(--l-correct-fg)}
.s-done{background:color-mix(in srgb,var(--pos) 22%,transparent);color:var(--l-done-fg)}
.s-cancel{background:var(--line-2);color:var(--muted)}
.s-assess{background:color-mix(in srgb,var(--pink) 18%,transparent);color:var(--l-assess-fg)}
.tag{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 6px}

.av{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-size:11px;font-weight:600;flex:none}
.av.lg{width:34px;height:34px;font-size:14px}
.avs{display:flex}
.avs .av{margin-left:-5px;border:2px solid var(--surface)}
.avs .av:first-child{margin-left:0}

.rules{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.7}

/* ---------- Tables / panels ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:hover td{background:var(--surface-2)}
tr.click{cursor:pointer}
.empty{color:var(--faint);text-align:center;padding:28px 10px}

/* ---------- Notifications ---------- */
.noti{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.noti:hover{background:var(--surface-2)}
.noti .dot{width:8px;height:8px;border-radius:50%;background:var(--pink);margin-top:7px;flex:none}
.noti.read .dot{background:transparent}
.noti.read .txt{color:var(--muted);font-weight:400}
.noti .txt{font-weight:600;min-width:0}
.noti .when{color:var(--faint);font-size:12px;font-weight:400;margin-left:6px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 12px;cursor:pointer}
.seg button.on{background:var(--primary);color:#fff}
.theme-seg{display:flex}
.theme-seg button{flex:1;font-size:12px;padding:5px 8px}

/* ---------- Dashboard ---------- */
.draft{font-size:12px;color:var(--neg);margin-bottom:10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:12px}
.kpi{border-radius:10px;padding:14px 16px;color:#fff;display:grid;gap:2px}
.kpi b{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi span{font-size:12px;opacity:.92}
.dash{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:12px}
.dash h3{margin:0 0 10px;font-size:13px;letter-spacing:.06em;color:var(--primary);font-weight:700}
.bar-row{display:grid;grid-template-columns:90px 1fr 28px;gap:8px;align-items:center;font-size:12px;margin-bottom:6px}
.bar-track{background:var(--surface-2);border-radius:4px;height:14px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
svg text{fill:var(--muted);font-family:var(--font)}

/* ---------- Modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(14,21,36,.45);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px));overflow:auto;z-index:20}
.modal{background:var(--surface);border-radius:16px;width:min(760px,100%);box-shadow:0 20px 50px rgba(0,0,0,.25);overflow:hidden}
.modal.narrow{width:min(520px,100%)}
.m-head{background:var(--nav-head);color:var(--nav-head-fg);padding:14px 18px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.m-head small{font-size:12px;opacity:.9;display:block}
.m-head h2{margin:0;font-size:17px;text-wrap:balance}
.m-x{background:rgba(255,255,255,.2);border:0;color:inherit;border-radius:8px;width:30px;height:30px;cursor:pointer;font-size:16px;flex:none}
.m-body{padding:16px 18px 20px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{border:0;background:none;padding:8px 12px;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--primary);border-bottom-color:var(--primary)}
.kv{display:grid;grid-template-columns:140px minmax(0,1fr);gap:5px 12px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;overflow-wrap:anywhere}
.sect{margin-bottom:18px}
.sect h4{margin:0 0 8px;font-size:13px}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;background:var(--surface-2);border-radius:10px;margin-bottom:16px}
.actions select{padding:5px 8px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface)}
.comment{background:var(--surface-2);border-radius:8px;padding:8px 10px;margin-bottom:6px}
.comment b{font-size:12px}
.comment .when{color:var(--faint);font-size:11px;margin-left:6px}
.comment p{margin:3px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.mention{color:var(--primary);font-weight:600}
.cbox{display:flex;gap:8px}
.cbox textarea{flex:1;min-width:0}

.form{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px 14px;align-items:center}
.form label.l{font-size:13px;color:var(--muted)}
.form .req{color:var(--neg)}
.form input[type=text],.form input[type=date],.form input[type=url],.form input[type=email],.form select,.form textarea,.cbox textarea,.f-input{width:100%;padding:7px 10px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);min-width:0}
.form input[readonly]{background:var(--surface-2);color:var(--muted)}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px}
.checks label{display:inline-flex;gap:5px;align-items:center;font-size:13px}
.err{color:var(--neg);font-size:12px;grid-column:2}
.hint{font-size:12px;color:var(--muted)}
.m-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.q{margin-bottom:14px}
.q p{margin:0 0 5px;font-weight:500}
.q .src{color:var(--neg);font-size:11px;font-weight:400}
.radios{display:flex;gap:14px;flex-wrap:wrap}
.radios label{display:inline-flex;gap:5px;align-items:center}
.score{font-size:28px;font-weight:600;color:var(--primary)}

.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:13px;max-width:min(380px,calc(100vw - 32px));z-index:40;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast.bad{background:var(--neg);color:#fff}

@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  .brand{border-radius:0}
  .nav{display:flex;overflow-x:auto;padding:6px 8px;gap:2px}
  .nav h6{display:none}
  .nav button{width:auto;white-space:nowrap;padding:7px 10px;border-radius:8px}
  .me{grid-template-columns:1fr 1fr;align-items:end}
  .form,.kv{grid-template-columns:1fr}
  .err{grid-column:1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="app">
  <aside class="side">
    <div class="brand"><span class="globe">TMS</span><div><b>TMS</b><small>Translation Hub</small></div></div>
    <nav class="nav" id="nav" aria-label="เมนูหลัก"></nav>
    <div class="me">
      <div class="me-row" id="meRow"></div>
      <div>
        <label for="persona">สลับผู้ใช้ (ทดลองสิทธิ์)</label>
        <select id="persona"></select>
      </div>
      <div class="seg theme-seg" role="group" aria-label="โหมดสี">
        <button type="button" data-theme-set="light">☀ กลางวัน</button>
        <button type="button" data-theme-set="dark">☾ กลางคืน</button>
      </div>
      <button class="linkbtn" id="resetBtn" type="button">รีเซ็ตข้อมูลตัวอย่าง</button>
    </div>
  </aside>
  <main id="main"></main>
</div>
<div id="modalRoot"></div>
<div id="toastRoot" aria-live="polite"></div>

<script>
(function(){
'use strict';
/* ================= Constants ================= */
const LANES=[
  {id:'todo',name:'To Do',who:'Reporter'},
  {id:'en',name:'English',who:'Translator EN'},
  {id:'cn',name:'Chinese',who:'Translator CN'},
  {id:'other',name:'Other',who:'Translator Other'},
  {id:'review',name:'Review',who:'Evaluator'},
  {id:'assessment',name:'Assessment',who:'Evaluator'},
  {id:'correction',name:'Correction',who:'Translator'},
  {id:'done',name:'Done',who:''}
];
const LANE_NAME=Object.fromEntries(LANES.map(l=>[l.id,l.name]));
const STATUSES=['TBC','Ready','On Going','Review','Edit','Assessment','Done','Cancel'];
const S_CLASS={'TBC':'s-tbc','Ready':'s-ready','On Going':'s-ongoing','Review':'s-review','Edit':'s-edit','Done':'s-done','Cancel':'s-cancel','Assessment':'s-assess'};
const LANGS=[{v:'EN',t:'English'},{v:'CN',t:'Chinese'},{v:'VN',t:'Vietnamese'},{v:'Other',t:'Other'}];
const TYPES=['Simultaneous Interpreter','Document Translation','Video Translation','Others'];
const SECTIONS=['FLP','PLP','LDP','SLP','KM','DGT','Convention','Others'];

/* ================= Helpers ================= */
const $=s=>document.querySelector(s);
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function d(iso){return iso?new Date(iso):null}
function fmtD(iso){if(!iso)return '-';return new Date(iso).toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'2-digit'})}
function fmtDT(iso){if(!iso)return '-';return new Date(iso).toLocaleString('th-TH',{day:'numeric',month:'short',year:'2-digit',hour:'2-digit',minute:'2-digit'})}
function ago(iso){const s=(Date.now()-new Date(iso))/1000;if(s<60)return 'เมื่อกี้';if(s<3600)return Math.floor(s/60)+' นาทีที่แล้ว';if(s<86400)return Math.floor(s/3600)+' ชม. ที่แล้ว';if(s<86400*7)return Math.floor(s/86400)+' วันที่แล้ว';if(s<86400*30)return Math.floor(s/86400/7)+' สัปดาห์ที่แล้ว';return Math.floor(s/86400/30)+' เดือนที่แล้ว'}
function nowISO(){return new Date().toISOString()}
function iso(y,m,dd,h){return new Date(y,m-1,dd,h||10,0).toISOString()}
function hash(s){let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)}
function av(name,cls){if(!name)return '';return `<span class="av ${cls||''}" style="background:${AV_COLORS[hash(name)%AV_COLORS.length]}" title="${esc(name)}">${esc([...name.replace(/^คุณ/,'').replace(/^[เแโใไ]/,'')][0]||'?')}</span>`}
function chip(st){return `<span class="chip ${S_CLASS[st]||''}">${esc(st)}</span>`}
function opt(list,sel,allLabel){return (allLabel?`<option value="">${allLabel}</option>`:'')+list.map(o=>{const v=typeof o==='object'?o.v:o,t=typeof o==='object'?o.t:o;return `<option value="${esc(v)}"${v===sel?' selected':''}>${esc(t)}</option>`}).join('')}
function safeUrl(u){return /^https:\/\/[^\s"'<>]+$/i.test(u||'')?u:''}
function toast(msg,bad){const r=$('#toastRoot');r.innerHTML=`<div class="toast${bad?' bad':''}" role="status">${esc(msg)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>r.innerHTML='',3200)}

function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify(S))}catch(e){}}
load();

const me=()=>S.users.find(u=>u.name===S.me)||S.users[0];
const userBy=n=>S.users.find(u=>u.name===n);
const cardBy=id=>S.cards.find(c=>c.id===id);
const translators=()=>S.users.filter(u=>u.role==='Translator'&&u.active);
const isAdmin=u=>u.role==='Admin';
const isEval=(u,c)=>isAdmin(u)||c.evaluator===u.name;
function roleLabel(u){return u.role==='Translator'?`Translator · ${u.lang}`:u.role}
function langLaneOf(u){return LANG_LANE[u.lang]}
function cardFitsLang(c,lang){if(lang==='Other')return c.languages.some(l=>l==='VN'||l==='Other');return c.languages.includes(lang)}

/* ================= Rules ================= */
function canMove(u,c,to){
  const from=c.lane;
  if(from===to)return {ok:false,why:''};
  if(c.status==='Cancel')return {ok:false,why:'การ์ดนี้ถูก Cancel แล้ว'};
  if(to==='assessment')return {ok:false,why:'ย้ายเข้า Assessment ด้วยปุ่ม "ส่งประเมิน" ในการ์ด เพื่อให้ระบบสร้างลิงก์ประเมิน'};
  if(from==='assessment'&&to==='done')return {ok:false,why:'การ์ดจะไป Done อัตโนมัติเมื่อ Evaluator กด Submit แบบประเมิน'};
  if(isAdmin(u))return {ok:true};
  if(from==='done')return {ok:false,why:'การ์ดที่ Done แล้วลากกลับได้เฉพาะ Admin'};
  if(u.role==='Translator'){
    const own=langLaneOf(u);
    if(from==='todo'&&to===own){
      if(c.status!=='Ready')return {ok:false,why:'ยังเริ่มแปลไม่ได้ ไฟล์ยังเป็น TBC รอ Reporter เปลี่ยนเป็น Ready'};
      if(!cardFitsLang(c,u.lang))return {ok:false,why:`การ์ดนี้ไม่ได้ขอภาษา ${u.lang}`};
      return {ok:true};
    }
    if(from==='todo')return {ok:false,why:`คุณลากจาก To Do ได้เฉพาะเลน ${LANE_NAME[own]}`};
    if(from===own&&to==='review')return {ok:true};
    if(['en','cn','other'].includes(from)&&to==='review')return {ok:false,why:'ลากไป Review ได้เฉพาะการ์ดในเลนภาษาของคุณ'};
    if(from==='correction'&&to==='review'){
      if(!cardFitsLang(c,u.lang))return {ok:false,why:`การ์ดนี้ไม่ใช่ภาษา ${u.lang} ลากไม่ได้`};
      return {ok:true};
    }
    return {ok:false,why:'Translator ลากได้: To Do → เลนภาษาตัวเอง, ภาษา → Review, Correction → Review'};
  }
  if(from==='review'&&to==='correction'&&(u.role==='Reporter'||isEval(u,c)))return {ok:true};
  if(u.role==='Reporter')return {ok:false,why:'Reporter ลากได้เฉพาะ Review → Correction'};
  return {ok:false,why:'ไม่มีสิทธิ์ย้ายการ์ดนี้'};
}
function canEdit(u,c){if(c.status==='Cancel'||c.lane==='done')return isAdmin(u);if(isAdmin(u)||u.role==='Reporter')return true;return cardFitsLang(c,u.lang)}

/* ================= Mutations ================= */
function log(action,target){S.audit.unshift({date:nowISO(),user:S.me,action,target})}
function notify(to,text,card){const list=[...new Set(to.filter(Boolean))].filter(n=>n!==S.me);if(!list.length)return;S.notis.unshift({id:'n'+Date.now()+Math.random().toString(36).slice(2,6),to:list,text,card,date:nowISO(),read:{}})}
function hist(c,action){c.history.push({user:S.me,lane:LANE_NAME[c.lane],action,date:nowISO()});c.updatedAt=nowISO()}
function team(c){return [c.assignee,...c.collaborators]}

function moveCard(c,to){
  const r=canMove(me(),c,to);
  if(!r.ok){if(r.why)toast(r.why,true);return false}
  const from=c.lane;c.lane=to;
  const label=`${LANE_NAME[from]} → ${LANE_NAME[to]}`;
  if(['en','cn','other'].includes(to)){c.status='On Going';if(!c.assignee&&me().role==='Translator')c.assignee=S.me}
  else if(to==='review'){c.status='Review';notify([c.evaluator],from==='correction'?'แก้ไขเสร็จแล้วพร้อม Review':'แปลเสร็จแล้วพร้อม Review',c.id)}
  else if(to==='correction'){c.status='Edit';c.revision=(c.revision||0)+1;notify(team(c),'งานต้องการการแก้ไข กรุณาตรวจสอบ',c.id)}
  else if(to==='done'){c.status='Done';c.doneAt=c.doneAt||nowISO()}
  else if(to==='todo'){c.status=c.readyAt?'Ready':'TBC'}
  hist(c,label);log(label,c.id);save();toast(`ย้าย ${c.id} ไป ${LANE_NAME[to]} แล้ว (Status: ${c.status})`);return true;
}
function toReady(c){c.status='Ready';c.readyAt=nowISO();hist(c,'TBC → Ready');log('TBC → Ready',c.id);notify(team(c),'ไฟล์ final แล้ว! สามารถเริ่มแปลได้',c.id);save();toast('เปลี่ยนเป็น Ready แล้ว และแจ้งเตือนผู้รับงานแล้ว')}
function toAssessment(c){c.lane='assessment';c.status='Assessment';c.assessLink='FORM-'+c.id.slice(4);hist(c,'Review → Assessment');log('Review → Assessment',c.id);notify([c.evaluator],'พร้อมประเมิน — ลิงก์ประเมินถูกส่งให้คุณแล้ว',c.id);save();toast('ส่งเข้า Assessment แล้ว ระบบสร้างลิงก์ประเมินให้ Evaluator')}
function submitAssessment(c,a){c.assessment=Object.assign(a,{by:S.me,date:nowISO()});c.lane='done';c.status='Done';c.doneAt=nowISO();hist(c,'Submit แบบประเมิน → Done');log('Submit แบบประเมิน',c.id);notify([...team(c),c.reporter],'งานเสร็จสมบูรณ์',c.id);save();toast('ส่งแบบประเมินแล้ว การ์ดย้ายไป Done อัตโนมัติ')}
function cancelCard(c,reason){c.status='Cancel';c.cancelReason=reason;hist(c,'Cancel: '+reason);log('Cancel',c.id);notify([...team(c),c.reporter],'การ์ดถูก Cancel — '+reason,c.id);save();toast(`Cancel ${c.id} แล้ว ค้นหาได้ใน All Cards`)}
function deleteCard(c){S.cards=S.cards.filter(x=>x.id!==c.id);log('ลบการ์ด',c.id);save();toast(`ลบ ${c.id} ออกจากระบบแล้ว`)}
function addComment(c,text){c.comments.push({user:S.me,text,date:nowISO()});c.updatedAt=nowISO();const mentioned=S.users.filter(u=>text.includes('@'+u.name)).map(u=>u.name);notify(mentioned,`${S.me} กล่าวถึงคุณ : ${text}`,c.id);notify([...team(c),c.reporter].filter(n=>!mentioned.includes(n)),`${S.me} คอมเมนต์ : ${text}`,c.id);log('Comment',c.id);save()}

];
function myNotis(){const u=me();return S.notis.filter(n=>isAdmin(u)||n.to.includes(u.name))}

function boardCards(){const cut=Date.now()-30*DAY;return S.cards.filter(c=>c.status!=='Cancel'&&!(c.lane==='done'&&new Date(c.doneAt)<cut))}

/* ================= Board ================= */
function filterCards(list,f){
  const k=(f.k||'').trim().toLowerCase();
  return list.filter(c=>(!k||(c.id+' '+c.title+' '+c.note).toLowerCase().includes(k))
    &&(!f.lang||c.languages.includes(f.lang))&&(!f.sec||c.section===f.sec)&&(!f.pri||c.priority===f.pri)
    &&(!f.asg||c.assignee===f.asg||c.collaborators.includes(f.asg))&&(!f.st||c.status===f.st)&&(!f.type||c.type===f.type)
    &&(!f.lane||c.lane===f.lane)&&(!f.ev||c.evaluator===f.ev)&&(f.rev===undefined||f.rev===''||String(c.revision||0)===f.rev))
}
function filterBar(f,keys,prefix){
  const users=S.users.map(u=>u.name);const evals=S.users.filter(u=>u.role!=='Translator').map(u=>u.name);
  const F={k:`<label>Keyword<input id="${prefix}-k" data-f="k" value="${esc(f.k||'')}" placeholder="ID หรือชื่องาน"></label>`,
    lang:`<label>Language<select id="${prefix}-lang" data-f="lang">${opt(LANGS,f.lang,'All')}</select></label>`,
    sec:`<label>Reporter Section<select id="${prefix}-sec" data-f="sec">${opt(SECTIONS,f.sec,'All')}</select></label>`,
    pri:`<label>Priority<select id="${prefix}-pri" data-f="pri">${opt(PRIORITIES,f.pri,'All')}</select></label>`,
    asg:`<label>Assignee<select id="${prefix}-asg" data-f="asg">${opt(translators().map(u=>u.name),f.asg,'All')}</select></label>`,
    st:`<label>Status<select id="${prefix}-st" data-f="st">${opt(STATUSES.filter(s=>s!=='Cancel'),f.st,'All')}</select></label>`,
    type:`<label>Type<select id="${prefix}-type" data-f="type">${opt(TYPES,f.type,'All')}</select></label>`,
    lane:`<label>Lane<select id="${prefix}-lane" data-f="lane">${opt(LANES.map(l=>({v:l.id,t:l.name})),f.lane,'All')}</select></label>`,
    rev:`<label>Revision Round<select id="${prefix}-rev" data-f="rev">${opt(['0','1','2','3'],f.rev,'All')}</select></label>`,
    ev:`<label>Evaluator<select id="${prefix}-ev" data-f="ev">${opt(evals,f.ev,'All')}</select></label>`};
  void users;
  return `<div class="filters" data-fset="${prefix}">${keys.map(k=>F[k]).join('')}</div>`;
}
function cardFace(c,u){
  const late=c.deadline&&c.lane!=='done'&&new Date(c.deadline)<Date.now();
  const drag=(['done'].includes(c.lane)&&!isAdmin(u))||(u.role==='Translator'&&!cardFitsLang(c,u.lang))?'false':'true';
  return `<button type="button" class="card" draggable="${drag}" data-card="${esc(c.id)}">
    <span class="cid mono">${esc(c.id)}</span>
    <span class="ttl">${esc(c.title)}</span>
    <span class="row">${chip(c.status)}<span class="tag">${esc(c.section)}</span>${c.languages.map(l=>`<span class="tag">${esc(l)}</span>`).join('')}${c.priority==='Urgent'?'<span class="urgent">URGENT</span>':''}${c.revision?`<span class="tag">รอบแก้ ${c.revision}</span>`:''}</span>
    <span class="foot"><span class="avs">${[c.assignee,...c.collaborators].filter(Boolean).map(n=>av(n)).join('')||'<span class="hint">ยังไม่มีผู้รับงาน</span>'}</span><span class="${late?'late':''}">${c.lane==='done'?'เสร็จ '+fmtD(c.doneAt):(c.deadline?(late?'เลยกำหนด ':'')+fmtD(c.deadline):'')}</span></span>
  </button>`;
}
function viewBoard(){
  const u=me();const list=filterCards(boardCards(),ui.f);
  const lanes=LANES.map(l=>{const cs=list.filter(c=>c.lane===l.id);return `<section class="lane" data-lane="${l.id}" aria-label="${l.name}">
    <div class="lane-h"><div>${l.name}<small>${l.who}</small></div><span class="cnt">${cs.length}</span></div>
    <div class="lane-body">${cs.map(c=>cardFace(c,u)).join('')||'<div class="lane-empty">ไม่มีการ์ด</div>'}${l.id==='done'?'<div class="lane-empty">การ์ดโชว์ใน Board 30 วัน<br>หลังจากนั้นค้นหาได้ใน All Cards</div>':''}</div></section>`}).join('');
  return `<div class="topbar"><div><h1>Board</h1><div class="sub">ล็อกอินเป็น ${esc(u.name)} (${esc(roleLabel(u))}) — ลากการ์ดเพื่อย้ายเลน หรือเปิดการ์ดแล้วใช้เมนู "ย้ายไป"</div></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><span class="demo-note">Prototype · ข้อมูลสมมุติ</span><button class="btn primary" type="button" id="addCard">+ Add Card</button></div></div>
    ${filterBar(ui.f,['k','lang','sec','pri','asg','st','type','lane','rev','ev'],'bf')}
    <div class="board-scroll"><div class="board">${lanes}</div></div>
    <p class="rules"><b>Drag Rules:</b> Reporter ลากได้แค่ Review → Correction · Translator ลากได้เฉพาะการ์ดที่ตรงภาษาตัวเองเท่านั้น: To Do → เลนภาษาตัวเอง (เฉพาะการ์ด Ready), ภาษา → Review, Correction → Review (เฉพาะการ์ดภาษาตัวเอง) · Evaluator ลาก Review → Correction และกด "ส่งประเมิน" เพื่อเข้า Assessment · Assessment ไป Done อัตโนมัติเมื่อ Submit แบบประเมิน · Done ลากกลับได้เฉพาะ Admin</p>`;
}

/* ================= Dashboard ================= */
function viewDash(){
  const f=ui.dashf;const all=filterCards(S.cards.filter(c=>c.status!=='Cancel'),f);
  const active=all.filter(c=>c.lane!=='done');const done=all.filter(c=>c.lane==='done');
  const scored=done.filter(c=>c.assessment);const avg=scored.length?(scored.reduce((s,c)=>s+c.assessment.score,0)/scored.length):0;
  const late=active.filter(c=>c.deadline&&new Date(c.deadline)<Date.now()).length;
  const onTime=scored.length?Math.round(scored.filter(c=>c.assessment.timing!=='ช้ากว่ากำหนด').length/scored.length*100):0;
  const laneColors={todo:'--l-todo-fg',en:'--l-en-fg',cn:'--l-cn-fg',other:'--l-other-fg',review:'--l-review-fg',assessment:'--l-assess-fg',correction:'--l-correct-fg'};
  const laneCounts=LANES.filter(l=>l.id!=='done').map(l=>({l,n:active.filter(c=>c.lane===l.id).length}));
  const maxN=Math.max(1,...laneCounts.map(x=>x.n));
  const bars=laneCounts.map(x=>`<div class="bar-row"><span>${x.l.name}</span><div class="bar-track"><div class="bar-fill" style="width:${x.n/maxN*100}%;background:var(${laneColors[x.l.id]})"></div></div><span class="mono">${x.n}</span></div>`).join('');
  // monthly done 2026 vs sample last year
  const thisY=Array.from({length:12},(_,m)=>done.filter(c=>{const t=new Date(c.doneAt);return t.getFullYear()===2026&&t.getMonth()===m}).length);
  const lastY=[1,1,2,1,2,1,2,2,1,2,2,1];
  const cur=new Date().getMonth();
  const W=520,Hh=200,pl=28,pr=12,pt=12,pb=26;const maxY=Math.max(3,...thisY,...lastY);
  const xs=m=>pl+m*(W-pl-pr)/11, ys=v=>pt+(Hh-pt-pb)*(1-v/maxY);
  const path=(arr,n)=>arr.slice(0,n).map((v,i)=>(i?'L':'M')+xs(i).toFixed(1)+' '+ys(v).toFixed(1)).join(' ');
  const months=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  let grid='';for(let v=0;v<=maxY;v++){grid+=`<line x1="${pl}" x2="${W-pr}" y1="${ys(v)}" y2="${ys(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-8}" y="${ys(v)+4}" font-size="10" text-anchor="end">${v}</text>`}
  const xl=months.map((m,i)=>`<text x="${xs(i)}" y="${Hh-6}" font-size="10" text-anchor="middle">${m}</text>`).join('');
  const nThis=Math.min(12,cur+1);
  const line=`<svg viewBox="0 0 ${W} ${Hh}" width="100%" role="img" aria-label="จำนวนงานที่เสร็จรายเดือน">${grid}${xl}
    <path d="${path(lastY,12)}" fill="none" stroke="var(--line-2)" stroke-width="2"/>
    <path d="${path(thisY,nThis)} L${xs(nThis-1)} ${ys(0)} L${xs(0)} ${ys(0)} Z" fill="var(--sky)" opacity=".12"/>
    <path d="${path(thisY,nThis)}" fill="none" stroke="var(--sky)" stroke-width="2.5"/>
    <circle cx="${xs(nThis-1)}" cy="${ys(thisY[nThis-1])}" r="4" fill="var(--sky)"/></svg>`;
  // pie by type
  const tc=TYPES.map(t=>({t,n:all.filter(c=>c.type===t).length})).filter(x=>x.n);
  const tot=tc.reduce((s,x)=>s+x.n,0)||1;const pc=['--sky','--pink','--teal','--amber'];
  let a0=-Math.PI/2;const R=70,cx=90,cy=90;
  const slices=tc.map((x,i)=>{const a1=a0+x.n/tot*Math.PI*2;const large=a1-a0>Math.PI?1:0;
    const p=tc.length===1?`<circle cx="${cx}" cy="${cy}" r="${R}" fill="var(${pc[i]})"/>`:`<path d="M${cx} ${cy} L${(cx+R*Math.cos(a0)).toFixed(2)} ${(cy+R*Math.sin(a0)).toFixed(2)} A${R} ${R} 0 ${large} 1 ${(cx+R*Math.cos(a1)).toFixed(2)} ${(cy+R*Math.sin(a1)).toFixed(2)} Z" fill="var(${pc[i]})" stroke="var(--surface)" stroke-width="2"/>`;a0=a1;return p}).join('');
  const pie=`<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap"><svg viewBox="0 0 180 180" width="180" height="180" role="img" aria-label="สัดส่วนประเภทงาน">${slices}<circle cx="${cx}" cy="${cy}" r="36" fill="var(--surface)"/><text x="${cx}" y="${cy+5}" text-anchor="middle" font-size="16" style="fill:var(--fg);font-weight:600">${all.length}</text></svg>
    <div class="legend" style="flex-direction:column;gap:6px">${tc.map((x,i)=>`<span><i style="background:var(${pc[i]})"></i>${esc(x.t)} <b class="mono">${x.n}</b></span>`).join('')}</div></div>`;
  return `<div class="topbar"><div><h1>Dashboard</h1><div class="sub">งาน & การประเมิน</div></div></div>
    <p class="draft">* หน้านี้เป็นร่าง — ทีมล่ามยังไม่คอนเฟิร์มหน้าแดชบอร์ด</p>
    ${filterBar(f,['k','lang','type','sec'],'df')}
    <div class="kpis">
      <div class="kpi" style="background:var(--primary)"><b>${active.length}</b><span>งานที่กำลังดำเนินการ</span></div>
      <div class="kpi" style="background:var(--pink)"><b>${late}</b><span>งานเลยกำหนด</span></div>
      <div class="kpi" style="background:var(--teal)"><b>${avg?avg.toFixed(1):'-'}<small style="font-size:14px">/5</small></b><span>คะแนนความพึงพอใจเฉลี่ย</span></div>
      <div class="kpi" style="background:var(--amber)"><b>${onTime}%</b><span>ส่งงานทันกำหนด</span></div>
    </div>
    <div class="dash">
      <div class="panel"><h3>งานตามเลน</h3>${bars}</div>
      <div class="panel"><h3>สัดส่วนประเภทงาน</h3>${pie}</div>
      <div class="panel" style="grid-column:1/-1"><h3>งานที่เสร็จรายเดือน</h3><div class="legend" style="margin-bottom:6px"><span><i style="background:var(--sky)"></i>ปีนี้</span><span><i style="background:var(--line-2)"></i>ปีที่แล้ว (ตัวเลขสมมุติ)</span></div><div class="tbl-wrap">${line}</div></div>
      <div class="panel tbl-wrap" style="grid-column:1/-1"><h3>ผลการประเมิน</h3><table><thead><tr><th>Type</th><th>Title</th><th>Assignee</th><th>Score</th><th>ตรงเวลา</th><th>Note</th></tr></thead><tbody>
      ${scored.sort((a,b)=>new Date(b.doneAt)-new Date(a.doneAt)).map(c=>`<tr class="click" data-card="${esc(c.id)}" tabindex="0"><td>${esc(c.type)}</td><td>${esc(c.title)}</td><td>${esc(c.assignee)}</td><td class="mono">${c.assessment.score}/5</td><td>${esc(c.assessment.timing)}</td><td>${esc(c.assessment.suggest||'-')}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">ยังไม่มีผลประเมิน</td></tr>'}
      </tbody></table></div>
    </div>`;
}

function viewAudit(){

/* ================= Modals ================= */
function openModal(html,narrow){$('#modalRoot').innerHTML=`<div class="overlay" id="ov"><div class="modal${narrow?' narrow':''}" role="dialog" aria-modal="true">${html}</div></div>`;const f=$('#modalRoot').querySelector('input,select,textarea,button:not(.m-x)');if(f)f.focus()}
function closeModal(){$('#modalRoot').innerHTML='';render()}
function head(sub,title){return `<div class="m-head"><div><small class="mono">${esc(sub)}</small><h2>${esc(title)}</h2></div><button class="m-x" type="button" data-close aria-label="ปิด">×</button></div>`}

let cardTab='info';
function openCard(id,tab){const c=cardBy(id);if(!c)return;cardTab=tab||'info';openModal(cardHtml(c));bindCard(c)}
function renderComment(t){let s=esc(t);S.users.forEach(u=>{const m='@'+esc(u.name);s=s.split(m).join(`<span class="mention">${m}</span>`)});return s}
function cardHtml(c){
  const u=me();const tabs=[['info','Status & Assignment info'],['assess','Assessment Link'],['hist','Status History']];
  let body='';
  if(cardTab==='info'){
    const allowed=LANES.filter(l=>canMove(u,c,l.id).ok);
    const acts=[];
    if(c.status==='TBC'&&(isAdmin(u)||c.reporter===u.name))acts.push('<button class="btn primary sm" type="button" data-act="ready">เปลี่ยน TBC → Ready</button>');
    if(c.lane==='review'&&c.status!=='Cancel'&&isEval(u,c))acts.push('<button class="btn primary sm" type="button" data-act="assess">ส่งประเมิน (Review → Assessment)</button>');
    if(allowed.length)acts.push(`<label class="hint" for="moveTo">ย้ายไป</label><select id="moveTo"><option value="">เลือกเลน</option>${allowed.map(l=>`<option value="${l.id}">${l.name}</option>`).join('')}</select><button class="btn sm" type="button" data-act="move">ย้าย</button>`);
    if(canEdit(u,c)&&c.status!=='Cancel')acts.push('<button class="btn sm" type="button" data-act="edit">แก้ไขการ์ด</button>');
    if(c.status!=='Cancel'&&c.lane!=='done')acts.push('<button class="btn sm danger" type="button" data-act="cancel">Cancel การ์ด</button>');
    if(isAdmin(u))acts.push('<button class="btn sm danger" type="button" data-act="delete">ลบการ์ด</button>');
    const dur=c.readyAt&&c.deadline?Math.max(0,Math.round((new Date(c.deadline)-new Date(c.readyAt))/DAY))+' วัน':'-';
    const link=safeUrl(c.link);
    body=`${acts.length?`<div class="actions">${acts.join('')}</div>`:''}<div id="inline"></div>
    <div class="sect"><h4>Status & Assignment</h4><dl class="kv">
      <dt>Status</dt><dd>${chip(c.status)}${c.cancelReason?` <span class="hint">เหตุผล: ${esc(c.cancelReason)}</span>`:''}</dd>
      <dt>Lane</dt><dd>${esc(LANE_NAME[c.lane])}</dd><dt>Reporter Section</dt><dd>${esc(c.section)}</dd>
      <dt>Language</dt><dd>${esc(c.languages.join(' / '))}</dd><dt>Type</dt><dd>${esc(c.type)}</dd>
      <dt>Assignee</dt><dd>${c.assignee?av(c.assignee)+' '+esc(c.assignee):'-'}</dd>
      <dt>Collaborator</dt><dd>${c.collaborators.map(n=>av(n)+' '+esc(n)).join('  ')||'-'}</dd>
      <dt>Reporter</dt><dd>${esc(c.reporter)} (${esc(c.section)})</dd><dt>Priority</dt><dd>${c.priority==='Urgent'?'<span class="urgent">URGENT</span>':'Normal'}</dd></dl></div>
    <div class="sect"><h4>Detail</h4><dl class="kv">
      <dt>Card ID</dt><dd class="mono">${esc(c.id)}</dd><dt>Created At</dt><dd>${fmtDT(c.createdAt)}</dd><dt>Ready At</dt><dd>${fmtDT(c.readyAt)}</dd>
      <dt>Updated At</dt><dd>${fmtDT(c.updatedAt)}</dd><dt>Deadline</dt><dd>${fmtD(c.deadline)}</dd><dt>Duration</dt><dd>${dur}</dd>
      <dt>Revision Round</dt><dd>${c.revision||0}</dd><dt>SharePoint Link</dt><dd>${link?`<a href="${esc(link)}" target="_blank" rel="noopener noreferrer">${esc(link)}</a>`:'-'}</dd>
      <dt>Evaluator</dt><dd>${esc(c.evaluator)}</dd><dt>Reporter Email</dt><dd>${esc(c.reporterEmail)}</dd><dt>Note</dt><dd>${esc(c.note||'-')}</dd></dl></div>
    <div class="sect"><h4>Comment</h4>${c.comments.map(x=>`<div class="comment"><b>${esc(x.user)}</b><span class="when">${ago(x.date)}</span><p>${renderComment(x.text)}</p></div>`).join('')||'<p class="hint">ยังไม่มีคอมเมนต์</p>'}
      <div class="cbox"><textarea id="cmt" rows="2" maxlength="1000" placeholder="พิมพ์ Comment หรือ @ชื่อ เพื่อ mention"></textarea><button class="btn primary" type="button" data-act="comment">ส่ง</button></div>
      <p class="hint">mention ได้: ${S.users.filter(x=>x.active).map(x=>'@'+esc(x.name)).join(' ')}</p></div>`;
  }else if(cardTab==='assess'){
    if(c.assessment){const a=c.assessment;body=`<div class="sect"><h4>ผลการประเมิน</h4><div class="score">${a.score}/5</div><dl class="kv"><dt>ตรงเวลา</dt><dd>${esc(a.timing)}</dd><dt>ข้อเสนอแนะ</dt><dd>${esc(a.suggest||'-')}</dd><dt>ประเมินโดย</dt><dd>${esc(a.by)} · ${fmtDT(a.date)}</dd><dt>ลิงก์ประเมิน</dt><dd class="mono">${esc(c.assessLink)}</dd></dl></div>`}
    else if(c.lane!=='assessment'){body='<p class="hint">กด Tab นี้ได้เมื่อการ์ดอยู่ใน Lane : Assessment</p>'}
    else if(!isEval(u,c)){body=`<p class="hint">รอ ${esc(c.evaluator)} ประเมินงาน (ลิงก์ ${esc(c.assessLink)})</p>`}
    else{body=`<form id="assessForm" novalidate><h4 style="margin-top:0">Translator Satisfaction</h4>
      <div class="q"><p>ประเภทภาษาของงานแปล <span class="src">— ดึงจากการ์ด</span></p><div class="checks">${LANGS.map(l=>`<label><input type="checkbox" disabled ${c.languages.includes(l.v)?'checked':''}> ${l.t}</label>`).join('')}</div></div>
      <div class="q"><p>ประเภทงานที่ท่านใช้บริการ <span class="src">— ดึงจากการ์ด</span></p><input class="f-input" readonly value="${esc(c.type)}"></div>
      <div class="q"><p>1. หน่วยงานของท่าน <span class="src">— ดึงจาก Account login</span></p><input class="f-input" readonly value="${esc((userBy(S.me)||{}).section?.join(', ')||c.section)}"></div>
      <div class="q"><p>2. หัวข้องานที่ท่านต้องการให้ล่ามแปล <span class="src">— ดึงจากการ์ด</span></p><input class="f-input" readonly value="${esc(c.title)}"></div>
      <div class="q"><p>3. ท่านมีความพึงพอใจกับคุณภาพของงานล่ามมากน้อยเพียงใด <span class="req">*</span><br><span class="hint">5 = พึงพอใจเป็นอย่างมาก · 1 = ไม่พึงพอใจเป็นอย่างมาก</span></p><div class="radios">${[1,2,3,4,5].map(n=>`<label><input type="radio" name="score" value="${n}"> ${n}</label>`).join('')}</div></div>
      <div class="q"><p>4. ท่านได้รับงานตามเวลาที่กำหนดหรือไม่ <span class="req">*</span></p><div class="radios">${['เร็วกว่ากำหนด','ตามกำหนด','ช้ากว่ากำหนด'].map(t=>`<label><input type="radio" name="timing" value="${t}"> ${t}</label>`).join('')}</div></div>
      <div class="q"><p>5. ข้อเสนอแนะเพิ่มเติม <span class="req">*</span></p><textarea class="f-input" id="suggest" rows="3" maxlength="1000"></textarea></div>
      <p class="err" id="aErr" style="grid-column:auto"></p>
      <div class="m-foot"><span class="hint" style="margin-right:auto">Submit ได้ครั้งเดียว</span><button class="btn primary" type="submit">Submit</button></div></form>`}
  }else{
    body=`<div class="tbl-wrap"><table><thead><tr><th>User name</th><th>Lane</th><th>Action</th><th>Date</th></tr></thead><tbody>${c.history.slice().reverse().map(h=>`<tr><td>${esc(h.user)}</td><td>${esc(h.lane)}</td><td>${esc(h.action)}</td><td class="mono">${fmtDT(h.date)}</td></tr>`).join('')}</tbody></table></div>`;
  }
  return head(c.id,c.title)+`<div class="m-body"><div class="tabs" role="tablist">${tabs.map(t=>`<button type="button" role="tab" data-tab="${t[0]}" class="${cardTab===t[0]?'on':''}" aria-selected="${cardTab===t[0]}">${t[1]}</button>`).join('')}</div>${body}</div>`;
}
function bindCard(c){
  const root=$('#modalRoot');
  root.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{cardTab=b.dataset.tab;root.querySelector('.modal').innerHTML=cardHtml(c);bindCard(c)});
  const re=()=>{const cc=cardBy(c.id);if(!cc){closeModal();return}root.querySelector('.modal').innerHTML=cardHtml(cc);bindCard(cc);renderNav()};
  root.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{
    const a=b.dataset.act;const inl=$('#inline');
    if(a==='ready'){toReady(c);re()}
    else if(a==='assess'){toAssessment(c);cardTab='assess';re()}
    else if(a==='move'){const to=$('#moveTo').value;if(!to){toast('เลือกเลนที่จะย้ายก่อน',true);return}if(moveCard(c,to))re()}
    else if(a==='edit'){openForm(c)}
    else if(a==='comment'){const t=$('#cmt').value.trim();if(!t){toast('พิมพ์ข้อความก่อนส่ง',true);return}addComment(c,t);re()}
    else if(a==='cancel'){inl.innerHTML=`<div class="actions" style="display:grid;gap:8px"><label for="cReason"><b>เหตุผลที่ Cancel</b> <span class="req">*</span></label><textarea id="cReason" class="f-input" rows="2" maxlength="300"></textarea><div style="display:flex;gap:8px"><button class="btn danger sm" type="button" id="cOk">ยืนยัน Cancel</button><button class="btn sm" type="button" id="cNo">ไม่ Cancel</button></div></div>`;$('#cReason').focus();
      $('#cNo').onclick=()=>inl.innerHTML='';$('#cOk').onclick=()=>{const r=$('#cReason').value.trim();if(!r){toast('ต้องใส่เหตุผลก่อน Cancel',true);return}cancelCard(c,r);re()}}
    else if(a==='delete'){inl.innerHTML=`<div class="actions"><span>ลบ <b>${esc(c.id)}</b> ออกจากระบบถาวร?</span><button class="btn danger sm" type="button" id="dOk">ลบถาวร</button><button class="btn sm" type="button" id="dNo">ไม่ลบ</button></div>`;
      $('#dNo').onclick=()=>inl.innerHTML='';$('#dOk').onclick=()=>{deleteCard(c);closeModal()}}
  });
  const af=$('#assessForm');
  if(af)af.onsubmit=e=>{e.preventDefault();const sc=af.querySelector('input[name=score]:checked'),tm=af.querySelector('input[name=timing]:checked'),sg=$('#suggest').value.trim();
    if(!sc||!tm||!sg){$('#aErr').textContent='กรุณาตอบข้อ 3, 4 และ 5 ให้ครบ';return}
    submitAssessment(c,{score:+sc.value,timing:tm.value,suggest:sg});re()};
}

function openForm(c){
  const u=me();const isNew=!c;const nextId='TMS-'+String(S.seq+1).padStart(5,'0');
  const v=c||{id:nextId,title:'',status:'TBC',languages:[],type:'Document Translation',reporter:u.name,section:u.section[0]||'FLP',reporterEmail:u.email,assignee:'',collaborators:[],evaluator:u.role==='Translator'?'':u.name,note:'',priority:'Normal',deadline:'',link:''};
  const tr=translators().map(x=>x.name);const evals=S.users.filter(x=>x.role!=='Translator'&&x.active).map(x=>x.name);
  openModal(head(v.id,isNew?'New Card':'แก้ไขการ์ด')+`<div class="m-body"><form id="cardForm" class="form" novalidate>

    <label class="l">Language <span class="req">*</span></label><div class="checks">${LANGS.map(l=>`<label><input type="checkbox" name="lang" value="${l.v}" ${v.languages.includes(l.v)?'checked':''}> ${l.t}</label>`).join('')}</div><span class="err" id="eLang"></span>
    <label class="l" for="fType">Type <span class="req">*</span></label><select id="fType">${opt(TYPES,v.type)}</select>
    <label class="l">Reporter Name</label><input type="text" readonly value="${esc(v.reporter)}">
    <label class="l" for="fSec">Reporter Section <span class="req">*</span></label><select id="fSec">${opt(SECTIONS,v.section)}</select>
    <label class="l">Reporter Email</label><input type="text" readonly value="${esc(v.reporterEmail)}">

    <label class="l">Collaborator</label><div class="checks">${tr.map(n=>`<label><input type="checkbox" name="collab" value="${esc(n)}" ${v.collaborators.includes(n)?'checked':''}> ${esc(n)}</label>`).join('')}</div>
    <label class="l" for="fEval">Evaluator <span class="req">*</span></label><select id="fEval">${opt(evals,v.evaluator,'— เลือก —')}</select><span class="err" id="eEval"></span>
    <label class="l" for="fNote">Note</label><textarea id="fNote" rows="2" maxlength="500">${esc(v.note)}</textarea>
    <label class="l" for="fPri">Priority <span class="req">*</span></label><select id="fPri">${opt(PRIORITIES,v.priority)}</select>
    <label class="l" for="fDl">Deadline <span class="req">*</span></label><input type="date" id="fDl" value="${v.deadline?new Date(v.deadline).toLocaleDateString('en-CA'):''}"><span class="err" id="eDl"></span>
    <label class="l" for="fLink">SharePoint Link</label><input type="url" id="fLink" maxlength="500" placeholder="https://..." value="${esc(v.link)}"><span class="err" id="eLink"></span>
    <span></span><div class="m-foot" style="margin:0"><button class="btn" type="button" data-close>ยกเลิก</button><button class="btn primary" type="submit">Save</button></div>
  </form></div>`);
  $('#cardForm').onsubmit=e=>{e.preventDefault();
    const g=id=>document.getElementById(id);['eTitle','eLang','eEval','eDl','eLink'].forEach(i=>g(i).textContent='');
    const title=g('fTitle').value.trim(),langs=[...document.querySelectorAll('input[name=lang]:checked')].map(x=>x.value),ev=g('fEval').value,dl=g('fDl').value,link=g('fLink').value.trim();
    let ok=true;if(!title){g('eTitle').textContent='กรอกชื่องาน';ok=false}if(!langs.length){g('eLang').textContent='เลือกอย่างน้อย 1 ภาษา';ok=false}if(!ev){g('eEval').textContent='เลือก Evaluator';ok=false}if(!dl){g('eDl').textContent='ระบุ Deadline';ok=false}

      S.cards.push(nc);hist(nc,`สร้างการ์ด (${st})`);log('สร้างการ์ด',nc.id);notify(team(nc),st==='Ready'?'งานใหม่ถูก assign ให้คุณแล้ว — ไฟล์พร้อมแปล':'งานใหม่ถูก assign ให้คุณแล้ว',nc.id);save();toast(`สร้าง ${nc.id} แล้ว`);closeModal()}
    else{Object.assign(c,data);hist(c,'แก้ไขรายละเอียดการ์ด');log('แก้ไขการ์ด',c.id);save();toast('บันทึกแล้ว');openCard(c.id)}
  };
}

    const data={name,email,role,lang:role==='Translator'?g('uLang').value:'',section:[...document.querySelectorAll('input[name=usec]:checked')].map(x=>x.value),mobile:g('uMob').value.trim(),line:g('uLine').value.trim(),active:document.querySelector('input[name=uact]:checked').value==='1'};
    if(isNew){S.users.push(Object.assign({id:v.id,created:nowISO(),last:''},data));log('สร้าง Account',email)}
    else{const old=v.name;Object.assign(v,data);if(old===S.me)S.me=name;log('แก้ไข Account / Role',email)}
    save();toast('บันทึกบัญชีแล้ว');closeModal()};
}

/* ================= Binding ================= */
function bindView(){
  const m=$('#main');
  m.querySelectorAll('[data-fset]').forEach(fs=>{const key={bf:'f',af:'acf',df:'dashf',uf:'uf'}[fs.dataset.fset];
    fs.querySelectorAll('[data-f]').forEach(el=>{el.addEventListener(el.tagName==='INPUT'?'input':'change',()=>{ui[key][el.dataset.f]=el.value;const id=el.id,pos=el.selectionStart;render();const n=document.getElementById(id);if(n){n.focus();if(n.setSelectionRange&&pos!=null)try{n.setSelectionRange(pos,pos)}catch(e){}}})})});
  m.querySelectorAll('[data-card]').forEach(el=>{el.addEventListener('click',()=>openCard(el.dataset.card));if(el.tagName==='TR')el.addEventListener('keydown',e=>{if(e.key==='Enter')openCard(el.dataset.card)})});
  const add=$('#addCard');if(add)add.onclick=()=>openForm(null);
  const nu=$('#newUser');if(nu)nu.onclick=()=>openUser(null);
  m.querySelectorAll('[data-edituser]').forEach(b=>b.onclick=()=>openUser(S.users.find(x=>x.id===b.dataset.edituser)));
  m.querySelectorAll('[data-ntab]').forEach(b=>b.onclick=()=>{ui.notiTab=b.dataset.ntab;render()});
  const ra=$('#readAll');if(ra)ra.onclick=()=>{myNotis().forEach(n=>n.read[S.me]=true);save();render()};
  m.querySelectorAll('[data-noti]').forEach(el=>{const go=()=>{const n=S.notis.find(x=>x.id===el.dataset.noti);n.read[S.me]=true;save();renderNav();if(cardBy(n.card))openCard(n.card);else{toast('การ์ดนี้ถูกลบแล้ว',true);render()}};el.onclick=go;el.onkeydown=e=>{if(e.key==='Enter')go()}});
  // drag & drop
  let dragId=null;
  m.querySelectorAll('.card[draggable="true"]').forEach(el=>{
    el.addEventListener('dragstart',e=>{dragId=el.dataset.card;el.classList.add('dragging');try{e.dataTransfer.setData('text/plain',dragId);e.dataTransfer.effectAllowed='move'}catch(_){}
      const c=cardBy(dragId);m.querySelectorAll('.lane').forEach(l=>{if(l.dataset.lane!==c.lane)l.classList.add(canMove(me(),c,l.dataset.lane).ok?'drop-ok':'drop-no')})});
    el.addEventListener('dragend',()=>{el.classList.remove('dragging');m.querySelectorAll('.lane').forEach(l=>l.classList.remove('drop-ok','drop-no'))});
  });
  m.querySelectorAll('.lane').forEach(l=>{
    l.addEventListener('dragover',e=>{if(dragId)e.preventDefault()});
    l.addEventListener('drop',e=>{e.preventDefault();const c=cardBy(dragId);dragId=null;if(c&&c.lane!==l.dataset.lane){moveCard(c,l.dataset.lane)}render()});
  });
}
$('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(!b)return;ui.view=b.dataset.view;try{localStorage.setItem(STORE_KEY+'-view',ui.view)}catch(_){}render()});
$('#persona').addEventListener('change',e=>{S.me=e.target.value;save();render();toast('สลับเป็น '+S.me+' แล้ว')});
/* Light / Dark toggle (remembered per browser; follows the OS until chosen) */
const THEME_KEY=STORE_KEY+'-theme';
function effTheme(){const a=document.documentElement.getAttribute('data-theme');if(a)return a;return window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}
function paintTheme(){const t=effTheme();document.querySelectorAll('[data-theme-set]').forEach(b=>{const on=b.dataset.themeSet===t;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)})}
function setTheme(t){document.documentElement.setAttribute('data-theme',t);try{localStorage.setItem(THEME_KEY,t)}catch(_){}paintTheme();render()}
try{const t=localStorage.getItem(THEME_KEY);if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(_){}
document.querySelectorAll('[data-theme-set]').forEach(b=>b.addEventListener('click',()=>setTheme(b.dataset.themeSet)));
if(window.matchMedia)try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',paintTheme)}catch(_){}
paintTheme();
let resetArmed=false;
$('#resetBtn').addEventListener('click',e=>{if(!resetArmed){resetArmed=true;e.target.textContent='กดอีกครั้งเพื่อยืนยันรีเซ็ต';setTimeout(()=>{resetArmed=false;e.target.textContent='รีเซ็ตข้อมูลตัวอย่าง'},4000);return}
  resetArmed=false;e.target.textContent='รีเซ็ตข้อมูลตัวอย่าง';S=seed();save();ui.f={};ui.acf={};ui.uf={};ui.dashf={};render();toast('รีเซ็ตข้อมูลตัวอย่างแล้ว')});
$('#modalRoot').addEventListener('click',e=>{if(e.target.id==='ov'||e.target.closest('[data-close]'))closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#ov'))closeModal()});
render();
})();
</script>
